<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>gPhoto</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.45" stop-color="#1c71d8"/>
      <stop offset="1" stop-color="#0b2a55"/>
    </radialGradient>
  </defs>
  <!-- shutter housing -->
  <rect x="38" y="20" width="36" height="18" rx="5" fill="#3d3846"/>
  <rect x="88" y="24" width="18" height="10" rx="3" fill="#c01c28"/>
  <!-- body -->
  <rect x="10" y="32" width="108" height="78" rx="14" fill="url(#body)"/>
  <rect x="10" y="32" width="108" height="16" rx="14" fill="#77767b" opacity="0.5"/>
  <!-- lens -->
  <circle cx="64" cy="72" r="31" fill="#241f31"/>
  <circle cx="64" cy="72" r="25" fill="#deddda"/>
  <circle cx="64" cy="72" r="20" fill="url(#glass)"/>
  <ellipse cx="57" cy="64" rx="7" ry="5" fill="#ffffff" opacity="0.7"/>
  <!-- the g -->
  <text x="64" y="80" text-anchor="middle" font-family="sans-serif" font-weight="bold"
        font-size="24" fill="#ffffff" opacity="0.9">g</text>
  <!-- flash -->
  <rect x="94" y="42" width="16" height="9" rx="2" fill="#f6f5f4"/>
</svg>
